[project]
name = "text2sql-deepagent"
version = "0.1.0"
description = "A natural language to SQL query agent powered by LangChain's Deep Agents framework and OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "langchain>=1.3.12,<2.0.0",
    "langgraph>=1.2.6",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.26",
    "rich>=15.0.0",
    "langchain-openrouter>=0.2.8",
    "httpx[socks]>=0.28.1,<1.0.0",
]

[project.urls]
Repository = "https://github.com/langchain-ai/deepagents/tree/main/examples/text-to-sql-agent"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
